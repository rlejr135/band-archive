apiVersion: v1
kind: Secret
metadata:
  name: band-archive-secrets
  namespace: band-archive
type: Opaque
stringData:
  SECRET_KEY: "change-me-flask-secret"
  S3_ENDPOINT_URL: "https://<account-id>.r2.cloudflarestorage.com"
  S3_ACCESS_KEY: "your-r2-access-key"
  S3_SECRET_KEY: "your-r2-secret-key"
  S3_BUCKET_NAME: "band-archive"
  VITE_NAVER_MAP_CLIENT_ID: "your-naver-client-id"
